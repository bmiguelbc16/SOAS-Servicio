spring.application.name=contactos-servicios

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contactos_servicios}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# Permite JSON crudo ({ } ") dentro de la URL: Tomcat los rechaza por defecto (RFC 3986).
# Necesario para: /api/contactos/insertar/?contacto={"nombre":"...","apellido":"..."}
server.tomcat.relaxed-query-chars={,},"
